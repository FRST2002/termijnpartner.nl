<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Jouw offerte | TermijnPartner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--black:#111;--ink:#1C1B19;--gold:#C9972B;--gold-light:#d4a84a;--gold-dark:#a67d22;--paper:#FAF7F1;--grey:#3A3733;--line:#e6dfd0;--muted:#7a7468;--ok:#2f7d4f;--bad:#b3392f}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--grey);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:22px;letter-spacing:-.02em;color:var(--black)}.logo span{color:var(--gold)}
.badge{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:6px 14px;background:#f0eee9;color:var(--grey)}
.badge.verstuurd{background:#fbf3df;color:var(--gold-dark)}.badge.goedgekeurd{background:#e3f2e9;color:var(--ok)}.badge.afgekeurd{background:#fbe6e3;color:var(--bad)}
.hero{padding:36px 0 18px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-dark)}
h1{font:600 clamp(28px,5vw,40px) Fraunces,serif;color:var(--black);margin:6px 0 10px;letter-spacing:-.01em;line-height:1.15}
.meta{display:flex;flex-wrap:wrap;gap:8px 28px;font-size:14px}
.meta b{color:var(--ink)}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;margin:18px 0}
h2{font:600 22px Fraunces,serif;color:var(--black);margin:0 0 14px}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.shots img{width:100%;border-radius:12px;display:block;background:#bcd3e6;aspect-ratio:4/3;object-fit:cover}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:0 32px;margin-top:6px}
.spec div{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:10px 0;font-size:14px}
.spec span{color:var(--muted)}.spec b{color:var(--ink);text-align:right}
.draw{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.draw figure{margin:0;background:#f7f4ec;border:1px solid var(--line);border-radius:12px;padding:10px}
.draw figcaption{font-size:12px;font-weight:700;color:var(--muted);text-align:center;margin-top:4px}
svg text{font-family:Manrope,sans-serif}
table{width:100%;border-collapse:collapse;font-size:14.5px}
td{padding:11px 0;border-bottom:1px solid var(--line)}td.r{text-align:right;white-space:nowrap}
tr.sub td{color:var(--muted);font-size:13.5px}
tr.tot td{border-bottom:0;padding-top:16px;font-size:18px;font-weight:800;color:var(--black)}
.big{font:700 34px Fraunces,serif;color:var(--black)}
.mnd{margin-top:14px;background:#fbf3df;border:1px solid #efdca6;border-radius:12px;padding:14px 16px;font-size:14.5px}
.mnd b{color:var(--gold-dark);font-size:17px}
.actions{display:flex;flex-direction:column;gap:12px}
.btn{font:800 16px Manrope;border:0;border-radius:12px;padding:15px 20px;cursor:pointer}
.ok{background:var(--gold);color:var(--black)}.ok:hover{background:var(--gold-light)}
.no{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],textarea{width:100%;font:500 16px Manrope;padding:12px;border:1.5px solid var(--line);border-radius:10px}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
label.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px}
label.chk input{margin-top:4px;accent-color:var(--gold);width:18px;height:18px}
.banner{border-radius:14px;padding:16px 18px;font-weight:600;margin:18px 0}
.banner.goedgekeurd{background:#e3f2e9;color:var(--ok)}.banner.afgekeurd{background:#fbe6e3;color:var(--bad)}.banner.info{background:#fbf3df;color:var(--gold-dark)}
.note{white-space:pre-line}
.foot{font-size:12.5px;color:var(--muted);padding:6px 0 60px}
.pr{display:inline-block;margin-top:8px;font:700 14px Manrope;background:none;border:0;color:var(--gold-dark);cursor:pointer;text-decoration:underline}
@media(max-width:640px){.shots,.draw,.spec{grid-template-columns:1fr}.card{padding:18px}}
@media print{.top,.actions-card,.pr,.noprint{display:none!important}body{background:#fff}.card{break-inside:avoid;border-color:#ddd}}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="logo">Termijn<span>Partner</span></div><span class="badge" id="badge"></span></div></div>
<div class="wrap" id="app"><p style="padding:40px 0">Offerte laden&hellip;</p></div>

<script>
const $ = id => document.getElementById(id);
const eur = n => '€ ' + Math.round(n).toLocaleString('nl-NL');
const eur2 = n => '€ ' + n.toLocaleString('nl-NL', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = iso => new Date(iso).toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
const STATUS = { aanvraag: 'In behandeling', concept: 'In behandeling', verstuurd: 'Wacht op jouw reactie', goedgekeurd: 'Goedgekeurd', afgekeurd: 'Afgekeurd' };
const id = new URLSearchParams(location.search).get('id');

/* ---- technische tekeningen (maten volgen het 3D-model) ---- */
const FASC = 0.27, PITCH = 0.9;
function dimH(x1, x2, y, label, o = 14) {
  return `<g stroke="#1e88e5" fill="#1e88e5"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke-width="1.4"/><path d="M${x1} ${y}l7 -4v8zM${x2} ${y}l-7 -4v8z" stroke="none"/>
  <line x1="${x1}" y1="${y - 8}" x2="${x1}" y2="${y + 8}" stroke-width="1"/><line x1="${x2}" y1="${y - 8}" x2="${x2}" y2="${y + 8}" stroke-width="1"/></g>
  <g><rect x="${(x1 + x2) / 2 - 24}" y="${y - 10}" width="48" height="20" rx="3" fill="#fff" stroke="#c9d7e6"/><text x="${(x1 + x2) / 2}" y="${y + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#1C1B19">${label}</text></g>`;
}
function dimV(x, y1, y2, label) {
  return `<g stroke="#1e88e5" fill="#1e88e5"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke-width="1.4"/><path d="M${x} ${y1}l-4 7h8zM${x} ${y2}l-4 -7h8z" stroke="none"/>
  <line x1="${x - 8}" y1="${y1}" x2="${x + 8}" y2="${y1}" stroke-width="1"/><line x1="${x - 8}" y1="${y2}" x2="${x + 8}" y2="${y2}" stroke-width="1"/></g>
  <g><rect x="${x - 24}" y="${(y1 + y2) / 2 - 10}" width="48" height="20" rx="3" fill="#fff" stroke="#c9d7e6"/><text x="${x}" y="${(y1 + y2) / 2 + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#1C1B19">${label}</text></g>`;
}
const mm = m => Math.round(m * 1000);
function frontDrawing(c) {
  const w = c.w, hw = c.h - FASC, n = c.wins, gap = .16, side = .24, topB = .08, botB = .2;
  const ww = (w - 2 * side - (n - 1) * gap) / n, wh = hw - topB - botB;
  const VW = 560, VH = 360, padL = 70, padR = 30, padT = 70, padB = 70;
  const k = Math.min((VW - padL - padR) / w, (VH - padT - padB) / c.h);
  const ox = padL + ((VW - padL - padR) - w * k) / 2, oy = padT + ((VH - padT - padB) - c.h * k) / 2;
  const X = m => ox + m * k, Y = m => oy + m * k;     // y vanaf bovenkant dakrand
  const cl = c.claddingHex || '#dcdcd9';
  let s = `<svg viewBox="0 0 ${VW} ${VH}" width="100%" role="img" aria-label="Vooraanzicht met maten">`;
  s += `<rect x="${X(-.08)}" y="${Y(0)}" width="${(w + .16) * k}" height="${FASC * k}" fill="#3b4045" rx="2"/>`;
  s += `<rect x="${X(0)}" y="${Y(FASC)}" width="${w * k}" height="${hw * k}" fill="${cl}" stroke="#9a9a96"/>`;
  for (let i = 0; i < n; i++) {
    const x0 = side + i * (ww + gap);
    s += `<rect x="${X(x0)}" y="${Y(FASC + topB)}" width="${ww * k}" height="${wh * k}" fill="#cfe0ee" stroke="#3a3733" stroke-width="2.4"/>`;
    s += `<path d="M${X(x0)} ${Y(FASC + topB + wh)}L${X(x0 + ww / 2)} ${Y(FASC + topB + wh / 2)}L${X(x0)} ${Y(FASC + topB)}" fill="none" stroke="#3a3733" stroke-width=".8" opacity="${c.type === 'draai' ? .5 : 0}"/>`;
  }
  const yb = Y(c.h) + 34;
  s += dimH(X(0), X(w), yb, mm(w));
  if (n > 1) s += dimH(X(side), X(side + ww), Y(0) - 26, mm(ww));
  s += dimV(X(0) - 36, Y(0), Y(c.h), mm(c.h));
  s += dimV(X(w) + 26, Y(FASC + topB), Y(FASC + topB + wh), mm(wh));
  return s + '</svg>';
}
function roofDrawing(c) {
  const w = c.w, HW = Math.max(6.4, Math.round((w + 1.6) * 10) / 10), m = (HW - w) / 2;
  const VW = 560, VH = 360, padL = 30, padR = 30, padT = 40, padB = 100;
  const rw = HW + .5, k = Math.min((VW - padL - padR) / rw, 190 / 3.2);
  const ox = (VW - rw * k) / 2, oy = padT;
  const X = v => ox + (v + .25) * k, rh = 3.4;
  let s = `<svg viewBox="0 0 ${VW} ${VH}" width="100%" role="img" aria-label="Dakvlak met maten">`;
  s += `<path d="M${ox - 24} ${oy + rh * k + 18}L${ox + 12} ${oy}H${ox + rw * k - 12}L${ox + rw * k + 24} ${oy + rh * k + 18}Z" fill="#2c3035"/>`;
  for (let r = 1; r < 9; r++) s += `<line x1="${ox - 24 + r * 3}" y1="${oy + r * (rh * k + 18) / 9}" x2="${ox + rw * k + 24 - r * 3}" y2="${oy + r * (rh * k + 18) / 9}" stroke="#454b52" stroke-width="1"/>`;
  const dx = X(m), dy = oy + 0.95 * k, dh = 1.2 * k;
  s += `<rect x="${dx}" y="${dy}" width="${w * k}" height="${dh}" fill="#dcdcd9" stroke="#999"/><rect x="${dx + .22 * k}" y="${dy + .18 * k}" width="${(w - .44) * k}" height="${dh - .36 * k}" fill="#cfe0ee" stroke="#3a3733" stroke-width="2"/>`;
  const y1 = oy + rh * k + 46;
  s += dimH(X(0), X(m), y1 - 22, mm(m)) + dimH(X(m + w), X(HW), y1 - 22, mm(m));
  s += dimH(X(m), X(m + w), y1, mm(w)) + dimH(X(0), X(HW), y1 + 26, mm(HW));
  s += `<text x="${ox - 4}" y="${oy + rh * k + 88}" font-size="12" font-weight="700" fill="#7a7468">Dakhelling ± ${Math.round(Math.atan(PITCH) * 180 / Math.PI)}°</text>`;
  return s + '</svg>';
}

function render(q) {
  $('badge').textContent = STATUS[q.status]; $('badge').className = 'badge ' + q.status;
  const c = q.config || {};
  const nm = esc((q.customer.name || '').split(' ')[0]);
  const date = dt(q.sentAt || q.createdAt), valid = dt(new Date(new Date(q.sentAt || q.createdAt).getTime() + 30 * 864e5));
  let h = `<div class="hero"><div class="eyebrow">Offerte ${esc(q.nummer)}${q.version > 1 ? ' · versie ' + q.version : ''}</div>
    <h1>Jouw dakkapel op maat${nm ? ', ' + nm : ''}</h1>
    <div class="meta"><span>Datum <b>${date}</b></span><span>Geldig tot <b>${valid}</b></span><span>Voor <b>${esc(q.customer.name)}</b></span></div></div>`;

  if (q.status === 'aanvraag' || q.status === 'concept') {
    h += `<div class="banner info">We stellen je offerte samen. Zodra die klaar is, zie je hem hier en kun je hem goedkeuren. Je hoeft niets te doen.</div>`;
    $('app').innerHTML = h; return;
  }
  if (q.status === 'goedgekeurd') h += `<div class="banner goedgekeurd">Je hebt deze offerte goedgekeurd${q.decision ? ' op ' + dt(q.decision.at) : ''}. TermijnPartner neemt contact met je op voor de volgende stappen.</div>`;
  if (q.status === 'afgekeurd') h += `<div class="banner afgekeurd">Je hebt deze offerte afgekeurd${q.decision ? ' op ' + dt(q.decision.at) : ''}. Wil je iets laten aanpassen? Dan passen we de offerte voor je aan en krijg je hem opnieuw.</div>`;

  if (q.shots && q.shots.length) h += `<div class="card"><h2>Zo ziet je dakkapel eruit</h2><div class="shots">${q.shots.map(s => `<img src="${s}" alt="3D-impressie van je dakkapel">`).join('')}</div></div>`;

  h += `<div class="card"><h2>Specificaties</h2><div class="spec">
    <div><span>Breedte</span><b>${mm(c.w)} mm</b></div><div><span>Voorhoogte</span><b>${mm(c.h)} mm</b></div>
    <div><span>Aantal ramen</span><b>${c.wins}</b></div><div><span>Raamtype</span><b>${c.type === 'draai' ? 'Draai-kiep' : 'Vast glas'}</b></div>
    <div><span>Bekleding</span><b>${esc(c.material)}</b></div><div><span>Kleur bekleding</span><b>${esc(c.claddingColor)}</b></div>
    <div><span>Kleur kozijnen</span><b>${esc(c.frameColor)}</b></div><div><span>Plaatsing</span><b>${c.face === 'both' ? 'Voor- en achterzijde' : c.face === 'back' ? 'Achterzijde' : 'Voorzijde'}</b></div>
    <div><span>Rolluiken</span><b>${c.rol ? 'Ja' : 'Nee'}</b></div><div><span>Ventilatieroosters</span><b>${c.vent ? 'Ja' : 'Nee'}</b></div>
    <div><span>Horren in kiepramen</span><b>${c.hor && c.type === 'draai' ? 'Ja' : 'Nee'}</b></div><div><span>Airco-aansluiting</span><b>${c.ac ? 'Ja' : 'Nee'}</b></div>
    <div><span>Extra isolatie (Rc 6,0)</span><b>${c.iso ? 'Ja' : 'Nee'}</b></div><div><span>Glas</span><b>HR++ isolatieglas</b></div></div></div>`;

  h += `<div class="card"><h2>Tekening met maten</h2><div class="draw"><figure>${frontDrawing(c)}<figcaption>Vooraanzicht (maten in mm)</figcaption></figure><figure>${roofDrawing(c)}<figcaption>Dakvlak (maten in mm)</figcaption></figure></div>
    <p style="font-size:12.5px;color:var(--muted);margin:10px 0 0">Maten zijn indicatief. Na akkoord wordt alles opgemeten en definitief vastgelegd.</p></div>`;

  const excl = q.total / 1.21;
  h += `<div class="card"><h2>Prijs</h2><table>${(q.lines || []).map(([l, v]) => `<tr><td>${esc(l)}</td><td class="r">${v < 0 ? '− ' + eur(-v) : eur(v)}</td></tr>`).join('')}
    <tr class="sub"><td>Totaal excl. btw</td><td class="r">${eur(excl)}</td></tr><tr class="sub"><td>Btw 21%</td><td class="r">${eur(q.total - excl)}</td></tr>
    <tr class="tot"><td>Totaal incl. btw</td><td class="r"><span class="big">${eur(q.total)}</span></td></tr></table>
    <div class="mnd">Liever in termijnen betalen? Dat kan achteraf, vanaf <b>${eur2(q.total / 180)} per maand</b> (indicatief).</div>
    ${q.note ? `<p class="note" style="margin:16px 0 0"><b>Opmerking van TermijnPartner</b><br>${esc(q.note)}</p>` : ''}
    <button class="pr" onclick="print()">Download of print als PDF</button></div>`;

  if (q.status === 'verstuurd') {
    h += `<div class="card actions-card"><h2>Wat vind je ervan?</h2><div class="actions">
      <label class="chk"><input type="checkbox" id="agree"><span>Ik ga akkoord met deze offerte van ${eur(q.total)} incl. btw.</span></label>
      <input type="text" id="who" placeholder="Typ je volledige naam als handtekening" autocomplete="name" value="${esc(q.customer.name)}">
      <button class="btn ok" id="acc" disabled>Offerte goedkeuren</button>
      <button class="btn no" id="rej">Ik wil iets anders of niet doorgaan</button>
      <div id="rejbox" style="display:none"><textarea id="why" placeholder="Wat wil je laten aanpassen? (optioneel)"></textarea><button class="btn no" id="rej2" style="margin-top:10px;width:100%">Afkeuren versturen</button></div>
      <div id="err" style="color:var(--bad);font-weight:600"></div></div></div>`;
  }
  h += `<div class="foot">TermijnPartner · Offerte ${esc(q.nummer)}${q.version > 1 ? ' v' + q.version : ''} · Prijzen incl. btw en plaatsing · Geldig tot ${valid}</div>`;
  $('app').innerHTML = h;

  if (q.status === 'verstuurd') {
    const upd = () => $('acc').disabled = !($('agree').checked && $('who').value.trim());
    $('agree').onchange = upd; $('who').oninput = upd;
    $('rej').onclick = () => { $('rejbox').style.display = 'block'; $('rej').style.display = 'none'; };
    const send = async (action, body) => {
      $('err').textContent = '';
      try {
        const r = await fetch(`/api/quote?id=${encodeURIComponent(id)}&action=${action}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Mislukt');
        render({ ...j, customer: j.customer || q.customer }); scrollTo(0, 0);
      } catch (e) { $('err').textContent = e.message + '. Probeer het later opnieuw.'; }
    };
    $('acc').onclick = () => send('accept', { name: $('who').value });
    $('rej2').onclick = () => send('reject', { reason: $('why').value });
  }
}

(async () => {
  if (!id) { $('app').innerHTML = '<p style="padding:40px 0">Deze link is niet compleet.</p>'; return; }
  try {
    const r = await fetch('/api/quote?id=' + encodeURIComponent(id));
    if (!r.ok) throw 0;
    const q = await r.json();
    if (q.config) { const cfg = q.config; cfg.claddingHex = ({ Lichtgrijs: '#dcdcd9', Wit: '#f2f0ea', Antraciet: '#383c40', Zwart: '#1a1a1a', Zand: '#cdbd9c', Groen: '#4d6a55' })[cfg.claddingColor]; }
    render(q);
  } catch { $('app').innerHTML = '<p style="padding:40px 0">Deze offerte is niet gevonden. Controleer de link of neem contact op met TermijnPartner.</p>'; }
})();
</script>
</body>
</html>
